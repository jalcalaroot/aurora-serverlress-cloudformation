          Value: !Ref pTagValueBackupWeekly
        - Key: "automation:aws-backup-monthly"
          Value: !Ref pTagValueBackupMonthly          

  DbUserLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${pClusterId}-DbUser-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies: !If
        - EnableRDSProxyIAMAuth
        -
          - PolicyName: SecretsAndNet
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                  Resource:
                    - !Ref RDSSecret
                    - !Ref AppUserRDSSecret
                    - !Ref IAMAppUserRDSSecret
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                  Resource: "*"
        -
          - PolicyName: SecretsAndNet
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - secretsmanager:DescribeSecret
                  Resource:
                    - !Ref RDSSecret
                    - !Ref AppUserRDSSecret
                - Effect: Allow
                  Action:
                    - ec2:CreateNetworkInterface
                    - ec2:DescribeNetworkInterfaces
                    - ec2:DeleteNetworkInterface
                  Resource: "*"                
      Tags:
        - Key: "workload:apps"
          Value: !Ref pTagValueApps
        - Key: "workload:cost-center"
          Value: !Ref pTagValueCostCenter          
        - Key: "workload:environment"
          Value: !Ref pTagValueEnvironment
        - Key: "workload:buss-owner"
          Value: !Ref pTagValueBussOwner          
        - Key: "workload:maintenance-window"
          Value: !Ref pTagValueMaintenanceWindow
        - Key: "workload:project"
          Value: !Ref pTagValueProject
        - Key: "Name"
          Value: !Ref pTagValueName
        - Key: "automation:schedule"
          Value: !Ref pTagValueSchedule
        - Key: "security:availability"
          Value: !Ref pTagValueAvailability
        - Key: "security:criticity"
          Value: !Ref pTagValueCriticity
        - Key: "sn:architecture-type"
          Value: !Ref pTagValueArchitectureType
        - Key: "automation:aws-backup-daily"
          Value: !Ref pTagValueBackupDaily
        - Key: "automation:aws-backup-weekly"
          Value: !Ref pTagValueBackupWeekly
        - Key: "automation:aws-backup-monthly"
          Value: !Ref pTagValueBackupMonthly

  CreateDbUserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${pClusterId}-CreateDbUser'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DbUserLambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref AuroraSecurityGroup
        SubnetIds: !If
          - IsLambdaPrivate
          - !Split [ ",", !Ref SubnetsPrivate ]
          - !If
            - IsLambdaInternal
            - !Split [ ",", !Ref SubnetsInternal ]
            - !Ref "AWS::NoValue"         
      Tags:
        - Key: "workload:apps"
          Value: !Ref pTagValueApps
        - Key: "workload:cost-center"
          Value: !Ref pTagValueCostCenter          
        - Key: "workload:environment"
          Value: !Ref pTagValueEnvironment
        - Key: "workload:buss-owner"
          Value: !Ref pTagValueBussOwner          
        - Key: "workload:maintenance-window"
          Value: !Ref pTagValueMaintenanceWindow
        - Key: "workload:project"
          Value: !Ref pTagValueProject
        - Key: "workload:tech-owner"
          Value: !Ref pTagValueTechOwner          
        - Key: "Name"
          Value: !Ref pTagValueName
        - Key: "automation:schedule"
          Value: !Ref pTagValueSchedule
        - Key: "security:availability"
          Value: !Ref pTagValueAvailability
        - Key: "security:criticity"
          Value: !Ref pTagValueCriticity
        - Key: "sn:architecture-type"
          Value: !Ref pTagValueArchitectureType
        - Key: "automation:aws-backup-daily"
          Value: !Ref pTagValueBackupDaily
        - Key: "automation:aws-backup-weekly"
          Value: !Ref pTagValueBackupWeekly
        - Key: "automation:aws-backup-monthly"
          Value: !Ref pTagValueBackupMonthly        
      Code:
        S3Bucket: !Ref pLambdaBucket #sandbox-sandbox-infra-bucket
        S3Key: create-db-user.zip

  CreateAppUser:
    Type: Custom::CreateDbUser
    DependsOn:
      - AuroraRDSDBInstance   # ensures writer is up; keep if you also create a RO instance
    Properties:
      ServiceToken: !GetAtt CreateDbUserFunction.Arn
      DBEndpoint: !GetAtt AuroraDBCluster.Endpoint.Address
      DBPort: !GetAtt AuroraDBCluster.Endpoint.Port
      DBName: !Ref pDBName
      AdminSecretArn: !Ref RDSSecret
      AppSecretArn: !Ref AppUserRDSSecret
      IAMAppSecretArn: !If
        - EnableRDSProxyIAMAuth
        - !Ref IAMAppUserRDSSecret
        - !Sub ""
      GrantsSQL: !If
      - EnableRDSProxyIAMAuth
      - !Sub |
        GRANT CONNECT ON DATABASE "${pDBName}" TO "${pAppUsername}";
        ALTER ROLE "${pAppUsername}" IN DATABASE "${pDBName}" SET search_path = public;
        GRANT USAGE ON SCHEMA public TO "${pAppUsername}";
        GRANT ALL PRIVILEGES ON DATABASE "${pDBName}" TO "${pAppUsername}";
        GRANT ALL ON SCHEMA public TO "${pAppUsername}";        
        GRANT CONNECT ON DATABASE "${pDBName}" TO "${pIAMUsername}";
        ALTER ROLE "${pIAMUsername}" IN DATABASE "${pDBName}" SET search_path = public;
        GRANT USAGE ON SCHEMA public TO "${pIAMUsername}";
        GRANT ALL PRIVILEGES ON DATABASE "${pDBName}" TO "${pIAMUsername}";
        GRANT ALL ON SCHEMA public TO "${pIAMUsername}";
      - !Sub |
        GRANT CONNECT ON DATABASE "${pDBName}" TO "${pAppUsername}";
        ALTER ROLE "${pAppUsername}" IN DATABASE "${pDBName}" SET search_path = public;
        GRANT USAGE ON SCHEMA public TO "${pAppUsername}";
        GRANT ALL PRIVILEGES ON DATABASE "${pDBName}" TO "${pAppUsername}";
        GRANT ALL ON SCHEMA public TO "${pAppUsername}";                             


############################## END RDS APP USER CREATION ##############################

  AuroraDBEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rds/${pDBName}/endpoint
      Type: String
      Value: !GetAtt AuroraDBCluster.Endpoint.Address
      Description: "Aurora DB Cluster endpoint"
    DependsOn:
    - AuroraRDSDBInstance

  AuroraRDSProxyEndpointParameter:
    Condition: RequireRDSProxy
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rdsproxy/${pDBName}/endpoint
      Type: String
      Value: !GetAtt RDSDBProxy.Endpoint
      Description: "Aurora DB Cluster endpoint"
    DependsOn:
    - AuroraRDSDBInstance    

  AuroraDBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rds/${pDBName}/port
      Type: String
      Value: !GetAtt AuroraDBCluster.Endpoint.Port
      Description: "Aurora DB Cluster port"
    DependsOn:
    - AuroraRDSDBInstance

  DBPassSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rds/${pDBName}/passdbsecretarn
      Type: String
      Value: !GetAtt RDSSecret.Id
      Description: "Aurora DB Cluster password secret ARN"
    DependsOn:
    - AuroraRDSDBInstance

  RDSProxyRoleArn:
    Condition: RequireRDSProxy
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /rds/${pDBName}/rdsproxyrolearn
      Type: String
      Value: !GetAtt RDSDBProxyRole.Arn
      Description: "RDS Proxy Role ARN"
    DependsOn:
    - RDSDBProxyRole     
